<style>

    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#cfe6ff;}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;}
  canvas{background:#0a0f1e;border:2px solid #22355e;border-radius:8px;
    box-shadow:0 0 42px rgba(40,120,255,.22),0 0 120px rgba(0,0,0,.8);max-width:96vw;height:auto;}
  #hint{font-size:13px;color:#7d93bd;letter-spacing:.04em;text-align:center;}
  #hint b{color:#cfe6ff;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint"><b>WASD / Arrows</b> move &nbsp;·&nbsp; <b>SHIFT</b> sneak (silent) &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>R</b> restart &nbsp;·&nbsp; <b>M</b> mute &nbsp;·&nbsp; Recover every <b>data core</b>, then reach <b>EXTRACTION</b> unseen.</div>
</div>
<script>
"use strict";
/* ============================================================================
   NIGHT VAULT — an original top-down stealth game.
   Single-file vanilla JS + Canvas. Zero external requests; all art is drawn
   with code, all sound is synthesized with WebAudio.

   ENGINE LAYOUT (built for reuse — e.g. a heist variant swaps LEVELS data,
   objective labels and guard skins; the systems below stay the same):
     1. CONFIG / UTILS      5. WORLD (parse, collision, LOS, BFS pathfinding)
     2. AUDIO (synth SFX)   6. ENTITIES + AI (player, guards, cameras)
     3. INPUT               7. GAME STATE + UPDATE
     4. LEVELS (data)       8. RENDER (world, cones, lighting, HUD, screens)
                            9. MAIN LOOP
   ========================================================================== */

// ---------------- 1. CONFIG / UTILS ----------------
const W = 960, H = 600, TILE = 40;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const dist  = (x1,y1,x2,y2)=> Math.hypot(x2-x1, y2-y1);
function angDiff(a,b){ let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
function lerpAngle(a,b,t){ return a + angDiff(b,a)*clamp(t,0,1); }
function lerp(a,b,t){ return a+(b-a)*t; }
function mixColor(c1,c2,t){ // c = [r,g,b]
  return "rgb("+Math.round(lerp(c1[0],c2[0],t))+","+Math.round(lerp(c1[1],c2[1],t))+","+Math.round(lerp(c1[2],c2[2],t))+")";
}

// ---------------- 2. AUDIO (synthesized, no files) ----------------
let AC = null, muted = false;
function audioInit(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended') AC.resume();
}
function beep(freq,dur,type,gain,slideTo,delay){
  if(!AC || muted) return;
  const t0 = AC.currentTime + (delay||0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'square'; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
  g.gain.setValueAtTime(gain||0.05,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
}
const SFX = {
  click(){ beep(660,0.05,'square',0.035); },
  pickup(){ beep(880,0.12,'sine',0.08,1320); beep(1760,0.16,'sine',0.05,null,0.07); },
  suspicious(){ beep(520,0.09,'square',0.045,680); },
  alert(){ beep(240,0.22,'sawtooth',0.09,120); beep(240,0.22,'sawtooth',0.09,120,0.16); },
  caught(){ beep(170,0.5,'sawtooth',0.12,38); beep(85,0.6,'triangle',0.1,30,0.05); },
  unlock(){ beep(440,0.1,'sine',0.07,660); beep(660,0.14,'sine',0.07,880,0.09); },
  win(){ [523,659,784,1046].forEach((f,i)=>beep(f,0.2,'sine',0.08,null,i*0.11)); },
  step(){ beep(90+Math.random()*30,0.05,'triangle',0.02); },
  gstep(gain){ beep(70+Math.random()*20,0.06,'triangle',gain); }   // guard footstep, gain by distance
};

// ---------------- 3. INPUT ----------------
const keys = {};
addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  audioInit();
  onKey(e.code);
});
addEventListener('keyup', e=>{ keys[e.code] = false; });
addEventListener('blur', ()=>{ if(G.mode==='play') G.mode='pause'; for(const k in keys) keys[k]=false; });
canvas.addEventListener('pointerdown', ()=>{ audioInit(); if(G.mode==='title') onKey('Enter'); });

// ---------------- 4. LEVELS (data — swap this block for a heist variant) ----------------
// Tiles: # wall · C crate (cover) · . floor · D doorway · S shadow (dark, safer)
//        L light pool (exposed) · P player start · O data core · X extraction
const LEVELS = [
{
  name: "MISSION 1 — VAULT ANNEX",
  brief: "Recover 3 data cores from the annex vault, then reach extraction. Stay out of the cones.",
  map: [
"############################",
"#..........#.......#.......#",
"#.P..C.....#..O....#...C...#",
"#..........D.......D.......#",
"#..##......#.......#..##...#",
"#..........#.......#.......#",
"#....SSSS..###D#####.......#",
"#....SSSS..................#",
"#..C.......##......C...##..#",
"#..........##..............#",
"#..####....##....####......#",
"#..........##....#..O#.....#",
"#....C...........#...#..C..#",
"#..........#######D###D###.#",
"#...................#......#",
"#.O....C....LL......D...X..#",
"#..........LL......#.......#",
"############################"
  ],
  guards: [
    { path:[[13,1],[17,1],[17,5],[13,5]] },
    { path:[[5,8],[17,8],[17,9],[5,9]] },
    { path:[[3,14],[18,14],[18,16],[3,16]] }
  ],
  cameras: [
    { x:11, y:6,  base: Math.PI/2,  sweep:0.7, speed:0.55 },
    { x:19, y:13, base:-Math.PI/2,  sweep:0.5, speed:0.4  }
  ]
},
{
  name: "MISSION 2 — SERVER VAULT",
  brief: "The server vault is watched by 4 guards and 3 cameras. Recover 3 data cores and get out clean.",
  map: [
"##############################",
"#......#........#......#.....#",
"#.P....D...C....D..O...D..C..#",
"#......#........#......#.....#",
"#..##..#...##...#..##..#..##.#",
"#......#........#......#.....#",
"###D#####...#####...####D#####",
"#............................#",
"#.SSSS....C....LL....C....SS.#",
"#..SSSS...................SS.#",
"#....C....#######D#####......#",
"#..........#..........#..##..#",
"#..####....#....O.....#......#",
"#..........#..........#..C...#",
"#....C.....D..........D......#",
"#..........#..........#..##..#",
"####D########...####D#########",
"#...........#......#.........#",
"#.O....C....D..LL..D....X....#",
"##############################"
  ],
  guards: [
    { path:[[10,1],[15,1],[15,5],[10,5]] },
    { path:[[2,7],[27,7],[27,9],[2,9]] },
    { path:[[14,11],[21,11],[21,15],[14,15]] },
    { path:[[2,17],[28,17],[28,18],[2,18]] }
  ],
  cameras: [
    { x:8,  y:6,  base: Math.PI/2, sweep:0.75, speed:0.6  },
    { x:16, y:10, base: Math.PI/2, sweep:0.65, speed:0.5  },
    { x:19, y:16, base: Math.PI/2, sweep:0.7,  speed:0.45 }
  ]
}
];

// ---------------- 5. WORLD ----------------
let MAP = [], MAPW = 0, MAPH = 0;
function tileAt(tx,ty){ if(tx<0||ty<0||tx>=MAPW||ty>=MAPH) return '#'; return MAP[ty][tx]; }
function isSolidTile(tx,ty){ const t = tileAt(tx,ty); return t==='#' || t==='C'; }
function isSolidAt(px,py){ return isSolidTile(Math.floor(px/TILE), Math.floor(py/TILE)); }
function tileCenter(tx,ty){ return { x: tx*TILE + TILE/2, y: ty*TILE + TILE/2 }; }
function tileOf(e){ return { x: Math.floor(e.x/TILE), y: Math.floor(e.y/TILE) }; }

// Circle vs tile-grid collision, axis separated (slides along walls).
function circleHits(x,y,r){
  const x0=Math.floor((x-r)/TILE), x1=Math.floor((x+r)/TILE);
  const y0=Math.floor((y-r)/TILE), y1=Math.floor((y+r)/TILE);
  for(let ty=y0; ty<=y1; ty++) for(let tx=x0; tx<=x1; tx++){
    if(!isSolidTile(tx,ty)) continue;
    const rx=tx*TILE, ry=ty*TILE;
    const cx=Math.max(rx, Math.min(x, rx+TILE)), cy=Math.max(ry, Math.min(y, ry+TILE));
    const dx=x-cx, dy=y-cy;
    if(dx*dx + dy*dy < r*r) return true;
  }
  return false;
}
function moveCircle(e,dx,dy,r){
  if(dx!==0 && !circleHits(e.x+dx, e.y, r)) e.x += dx;
  if(dy!==0 && !circleHits(e.x, e.y+dy, r)) e.y += dy;
}

// Line of sight: sample along the segment; blocked by walls and crates.
function losClear(x1,y1,x2,y2){
  const d = dist(x1,y1,x2,y2), steps = Math.max(1, Math.ceil(d/4));
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(isSolidAt(x1+(x2-x1)*t, y1+(y2-y1)*t)) return false;
  }
  return true;
}
// Distance a ray travels before hitting something solid (for vision cones).
function rayDist(x,y,ang,maxD){
  const dx=Math.cos(ang), dy=Math.sin(ang), step=5;
  for(let t=step; t<maxD; t+=step){ if(isSolidAt(x+dx*t, y+dy*t)) return t; }
  return maxD;
}
// BFS shortest path on the tile grid → array of pixel waypoints (or null).
function findPath(sx,sy,tx,ty){
  if(sx===tx && sy===ty) return [];
  const key=(x,y)=> y*MAPW+x;
  const prev=new Map(); prev.set(key(sx,sy), null);
  const q=[[sx,sy]];
  while(q.length){
    const [x,y]=q.shift();
    if(x===tx && y===ty) break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=MAPW||ny>=MAPH || isSolidTile(nx,ny)) continue;
      const k=key(nx,ny); if(prev.has(k)) continue;
      prev.set(k,[x,y]); q.push([nx,ny]);
    }
  }
  if(!prev.has(key(tx,ty))) return null;
  const path=[]; let cur=[tx,ty];
  while(cur){ path.push(tileCenter(cur[0],cur[1])); cur=prev.get(key(cur[0],cur[1])); }
  return path.reverse();
}

// ---------------- 6. ENTITIES + AI ----------------
const P = { x:0,y:0,r:11,angle:0,sneak:false,moving:false,stepT:0 };   // player
let guards=[], cameras=[], pickups=[], particles=[], floats=[];
const exitPad = { x:0,y:0,tx:0,ty:0 };

const GUARD_RANGE=270, GUARD_FOV=1.28, CAM_RANGE=240, CAM_FOV=0.95;

function makeGuard(def){
  const pts = def.path.map(p=>tileCenter(p[0],p[1]));
  const g = { x:pts[0].x, y:pts[0].y, r:11, angle:0, wp:1, waypoints:pts,
    state:'patrol', meter:0, lastKnown:null, loseTimer:0, searchTimer:0,
    pathTo:[], repath:0, pauseT:0, lookPhase:Math.random()*TAU, popT:0, stepT:Math.random()*0.4 };
  g.angle = Math.atan2(pts[1].y-g.y, pts[1].x-g.x);
  return g;
}
function makeCamera(def){
  const c = tileCenter(def.x,def.y);
  return { x:c.x, y:c.y, base:def.base, sweep:def.sweep, speed:def.speed,
    angle:def.base, meter:0, phase:Math.random()*TAU, cooldown:0 };
}
// Camera "eye": pushed out of the wall tile it is mounted on.
function camEye(c){ return { x: c.x + Math.cos(c.angle)*TILE*0.62, y: c.y + Math.sin(c.angle)*TILE*0.62 }; }

// Can an observer at (x,y) facing `ang` see the player? Returns distance or 0.
function seePlayer(x,y,ang,range,fov){
  const d = dist(x,y,P.x,P.y);
  if(d>range) return 0;
  const a = Math.atan2(P.y-y, P.x-x);
  if(Math.abs(angDiff(a,ang)) > fov/2 && d>28) return 0;   // point-blank = always seen
  if(!losClear(x,y,P.x,P.y)) return 0;
  return d;
}
// How fast the detection meter fills at this distance / stance / lighting.
function detectRate(d,range){
  let r = 1.15 * (1.15 - d/range); if(r<0.18) r=0.18;
  if(P.sneak) r *= 0.45;
  const t = tileAt(Math.floor(P.x/TILE), Math.floor(P.y/TILE));
  if(t==='S') r *= 0.38;        // shadow: hard to spot
  else if(t==='L') r *= 1.6;    // light pool: exposed
  return r;
}
// Follow a BFS path (array of pixel points). Returns true when finished.
function followPath(e, dt, speed){
  while(e.pathTo.length && dist(e.x,e.y,e.pathTo[0].x,e.pathTo[0].y) < 5) e.pathTo.shift();
  if(!e.pathTo.length) return true;
  const t = e.pathTo[0];
  const a = Math.atan2(t.y-e.y, t.x-e.x);
  e.angle = lerpAngle(e.angle, a, dt*7);
  moveCircle(e, Math.cos(a)*speed*dt, Math.sin(a)*speed*dt, e.r);
  return false;
}
function pathToPoint(e, px, py){
  const s = tileOf(e), t = { x: Math.floor(px/TILE), y: Math.floor(py/TILE) };
  e.pathTo = findPath(s.x,s.y,t.x,t.y) || [];
}
function nearestWaypoint(g){
  let bi=0, bd=1e9;
  g.waypoints.forEach((w,i)=>{ const d=dist(g.x,g.y,w.x,w.y); if(d<bd){bd=d;bi=i;} });
  return bi;
}
function triggerAlarm(src){
  if(!G.alarmActive){ G.alarms++; G.alarmActive=true; SFX.alert(); }
  G.alarmTimer = 0;
  for(const g of guards){
    if(g!==src && (g.state==='patrol' || g.state==='suspicious')){
      g.state='search'; g.searchTimer=0; g.meter=Math.max(g.meter,0.6);
      g.lastKnown = { x:P.x, y:P.y }; pathToPoint(g, P.x, P.y);
    }
  }
}
function updateGuard(g, dt){
  g.lookPhase += dt;
  const prevX = g.x, prevY = g.y;
  const d = seePlayer(g.x,g.y,g.angle,GUARD_RANGE,GUARD_FOV);
  if(d){
    g.meter = Math.min(1, g.meter + detectRate(d,GUARD_RANGE)*dt);
    g.lastKnown = { x:P.x, y:P.y }; g.loseTimer = 0;
    if(g.state==='patrol' && g.meter>0.35){ g.state='suspicious'; g.popT=0.6; SFX.suspicious(); }
  } else {
    g.meter = Math.max(0, g.meter - (g.state==='alert'?0.04:0.32)*dt);
    if(g.state==='alert'){
      g.loseTimer += dt;
      if(g.loseTimer>2.5){ g.state='search'; g.searchTimer=0; if(g.lastKnown) pathToPoint(g,g.lastKnown.x,g.lastKnown.y); }
    }
  }
  // Hearing: unsneaked movement nearby draws attention.
  if(P.moving && !P.sneak && dist(g.x,g.y,P.x,P.y)<95 && g.state==='patrol'){
    g.state='suspicious'; g.popT=0.6; g.meter=Math.max(g.meter,0.45);
    g.lastKnown={x:P.x,y:P.y}; SFX.suspicious();
  }
  if(g.meter>=1 && g.state!=='alert'){ g.state='alert'; g.popT=0.8; triggerAlarm(g); }
  if(g.popT>0) g.popT-=dt;

  switch(g.state){
    case 'patrol': {
      if(g.pauseT>0){ g.pauseT-=dt; g.angle += Math.sin(g.lookPhase*1.4)*dt*0.9; break; }
      if(!g.pathTo.length){
        const w = g.waypoints[g.wp % g.waypoints.length];
        pathToPoint(g, w.x, w.y);
      }
      if(followPath(g,dt,56)){ g.wp++; g.pauseT = 0.8 + Math.random()*0.9; }
      break;
    }
    case 'suspicious': {
      if(g.lastKnown) g.angle = lerpAngle(g.angle, Math.atan2(g.lastKnown.y-g.y,g.lastKnown.x-g.x), dt*5);
      if(g.meter>0.62 && g.lastKnown){           // creep toward the stimulus
        if(!g.pathTo.length) pathToPoint(g,g.lastKnown.x,g.lastKnown.y);
        followPath(g,dt,62);
      } else g.pathTo.length = 0;
      if(g.meter<=0.12){ g.state='return'; const wi=nearestWaypoint(g); g.wp=wi+1; pathToPoint(g,g.waypoints[wi].x,g.waypoints[wi].y); }
      break;
    }
    case 'alert': {
      g.repath -= dt;
      if(g.repath<=0){ g.repath=0.4; pathToPoint(g,P.x,P.y); }
      if(g.pathTo.length) followPath(g,dt,138);
      else { const a=Math.atan2(P.y-g.y,P.x-g.x); g.angle=lerpAngle(g.angle,a,dt*8); moveCircle(g,Math.cos(a)*138*dt,Math.sin(a)*138*dt,g.r); }
      break;
    }
    case 'search': {
      if(g.pathTo.length){ followPath(g,dt,84); }
      else {
        g.searchTimer += dt;
        g.angle += Math.sin(g.lookPhase*2.2)*dt*2.4;   // scan the area
        if(g.searchTimer>3){ g.state='return'; g.meter=Math.min(g.meter,0.3); const wi=nearestWaypoint(g); g.wp=wi+1; pathToPoint(g,g.waypoints[wi].x,g.waypoints[wi].y); }
      }
      break;
    }
    case 'return': {
      if(followPath(g,dt,72)) g.state='patrol';
      break;
    }
  }
  // Footsteps: a moving guard is audible nearby — louder as he closes in.
  if(g.x!==prevX || g.y!==prevY){
    g.stepT += dt;
    if(g.stepT>0.38){
      g.stepT = 0;
      const pd2 = dist(g.x,g.y,P.x,P.y);
      if(pd2<340) SFX.gstep(0.004 + 0.03*(1 - pd2/340));
    }
  }
  // Caught: grabbed at close range.
  const pd = dist(g.x,g.y,P.x,P.y);
  if((g.state==='alert' && pd<21) || pd<13) loseGame();
}
function updateCamera(c, dt){
  c.phase += dt*c.speed;
  c.angle = c.base + Math.sin(c.phase)*c.sweep;
  if(c.cooldown>0) c.cooldown-=dt;
  const eye = camEye(c);
  const d = seePlayer(eye.x,eye.y,c.angle,CAM_RANGE,CAM_FOV);
  if(d) c.meter = Math.min(1, c.meter + detectRate(d,CAM_RANGE)*0.55*dt);
  else c.meter = Math.max(0, c.meter - 0.25*dt);
  if(c.meter>=1 && c.cooldown<=0){ c.cooldown=6; c.meter=0.55; triggerAlarm(null); }
}

// ---------------- 7. GAME STATE + UPDATE ----------------
const G = { mode:'title', level:0, time:0, totalTime:0, alarms:0, score:0,
  cores:0, coresTotal:0, alarmActive:false, alarmTimer:0, msg:'', msgT:0,
  levelScore:0, rank:'', camX:0, camY:0, shake:0, fade:0 };
let levelName='', levelBrief='';

function loadLevel(idx){
  const lv = LEVELS[idx];
  levelName = lv.name; levelBrief = lv.brief;
  MAP = lv.map.map(r=>r.split('')); MAPH = MAP.length; MAPW = MAP[0].length;
  pickups = []; particles = []; floats = [];
  for(let y=0;y<MAPH;y++) for(let x=0;x<MAPW;x++){
    const t = MAP[y][x], c = tileCenter(x,y);
    if(t==='P'){ P.x=c.x; P.y=c.y; MAP[y][x]='.'; }
    else if(t==='O'){ pickups.push({x:c.x,y:c.y,got:false,phase:Math.random()*TAU}); MAP[y][x]='.'; }
    else if(t==='X'){ exitPad.x=c.x; exitPad.y=c.y; exitPad.tx=x; exitPad.ty=y; }
  }
  P.angle = 0; P.sneak=false; P.moving=false;
  guards = lv.guards.map(makeGuard);
  cameras = lv.cameras.map(makeCamera);
  G.cores = 0; G.coresTotal = pickups.length;
  G.time = 0; G.alarms = 0; G.alarmActive=false; G.alarmTimer=0; G.msg=''; G.msgT=0;
  updateCameraPos(1);
}
function updateCameraPos(snap){
  const tx = clamp(P.x - W/2, 0, Math.max(0, MAPW*TILE - W));
  const ty = clamp(P.y - H/2, 0, Math.max(0, MAPH*TILE - H));
  if(snap){ G.camX=tx; G.camY=ty; }
  else { G.camX = lerp(G.camX,tx,0.12); G.camY = lerp(G.camY,ty,0.12); }
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU, s=30+Math.random()*90;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5+Math.random()*0.4,t:0,color,size:2+Math.random()*2.5});
  }
}
function floatText(x,y,text,color){ floats.push({x,y,text,color,t:0}); }
function showMsg(text,secs){ G.msg=text; G.msgT=secs||2.5; }

function loseGame(){
  if(G.mode!=='play') return;
  G.mode='lose'; G.shake=0.5; SFX.caught();
}
function winLevel(){
  const timeBonus = Math.max(0, Math.round(600 - G.time*2));
  const ghostBonus = G.alarms===0 ? 500 : G.alarms===1 ? 200 : 0;
  G.levelScore = 1000 + G.cores*100 + timeBonus + ghostBonus;
  G.score += G.levelScore; G.totalTime += G.time;
  G.rank = G.alarms===0 ? 'GHOST' : G.alarms===1 ? 'SHADOW' : G.alarms<=3 ? 'OPERATIVE' : 'BLUNT INSTRUMENT';
  G.mode='win'; SFX.win();
}
function onKey(code){
  if(code==='KeyM'){ muted=!muted; return; }
  switch(G.mode){
    case 'title':
      if(code==='Enter' || code==='Space'){ SFX.click(); G.level=0; G.score=0; G.totalTime=0; loadLevel(0); G.mode='brief'; }
      break;
    case 'brief':
      if(code==='Enter' || code==='Space'){ SFX.click(); G.mode='play'; }
      break;
    case 'play':
      if(code==='KeyP' || code==='Escape') G.mode='pause';
      if(code==='KeyR'){ loadLevel(G.level); G.mode='brief'; }
      break;
    case 'pause':
      if(code==='KeyP' || code==='Escape' || code==='Enter') G.mode='play';
      if(code==='KeyR'){ loadLevel(G.level); G.mode='brief'; }
      break;
    case 'win':
      if(code==='Enter' || code==='Space'){
        SFX.click();
        if(G.level+1 < LEVELS.length){ G.level++; loadLevel(G.level); G.mode='brief'; }
        else G.mode='victory';
      }
      break;
    case 'lose':
      if(code==='KeyR' || code==='Enter'){ SFX.click(); loadLevel(G.level); G.mode='brief'; }
      break;
    case 'victory':
      if(code==='Enter' || code==='Space'){ SFX.click(); G.mode='title'; }
      break;
  }
}
function update(dt){
  if(G.mode!=='play') return;
  G.time += dt;
  if(G.msgT>0) G.msgT -= dt;
  if(G.shake>0) G.shake -= dt;

  // --- player movement ---
  const mx = ((keys.KeyD||keys.ArrowRight)?1:0) - ((keys.KeyA||keys.ArrowLeft)?1:0);
  const my = ((keys.KeyS||keys.ArrowDown)?1:0) - ((keys.KeyW||keys.ArrowUp)?1:0);
  P.sneak = !!(keys.ShiftLeft || keys.ShiftRight);
  const len = Math.hypot(mx,my);
  if(len>0){
    P.angle = Math.atan2(my,mx);
    const sp = P.sneak ? 78 : 152;
    moveCircle(P, mx/len*sp*dt, my/len*sp*dt, P.r);
    P.moving = true; P.stepT += dt;
    if(!P.sneak && P.stepT>0.34){ P.stepT=0; SFX.step(); }
  } else P.moving = false;

  // --- pickups / exit ---
  for(const pk of pickups){
    pk.phase += dt*2;
    if(!pk.got && dist(P.x,P.y,pk.x,pk.y) < 24){
      pk.got = true; G.cores++;
      burst(pk.x,pk.y,'#39e6ff',16); floatText(pk.x,pk.y-14,'DATA CORE','#39e6ff');
      SFX.pickup();
      if(G.cores>=G.coresTotal){ showMsg('ALL CORES RECOVERED — GET TO EXTRACTION',3.5); SFX.unlock(); }
      else showMsg('DATA CORE RECOVERED  '+G.cores+' / '+G.coresTotal,2);
    }
  }
  if(dist(P.x,P.y,exitPad.x,exitPad.y) < 26){
    if(G.cores>=G.coresTotal){ winLevel(); return; }
    else if(G.msgT<=0) showMsg('EXTRACTION LOCKED — RECOVER ALL DATA CORES',1.6);
  }

  // --- AI ---
  for(const g of guards) updateGuard(g,dt);
  if(G.mode!=='play') return;              // caught during guard update
  for(const c of cameras) updateCamera(c,dt);

  // --- alarm decay ---
  if(G.alarmActive){
    const hot = guards.some(g=>g.state==='alert'||g.state==='search');
    if(!hot){ G.alarmTimer += dt; if(G.alarmTimer>6){ G.alarmActive=false; G.alarmTimer=0; showMsg('ALARM CLEARED',1.8); } }
    else G.alarmTimer = 0;
  }

  // --- fx ---
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; if(p.t>p.life) particles.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.t+=dt; f.y-=22*dt; if(f.t>1.1) floats.splice(i,1); }
  updateCameraPos(0);
}
function globalMeter(){
  let m = 0;
  for(const g of guards) m = Math.max(m, g.meter);
  for(const c of cameras) m = Math.max(m, c.meter);
  return m;
}

// ---------------- 8. RENDER ----------------
const lightCanvas = document.createElement('canvas');
lightCanvas.width = W; lightCanvas.height = H;
const lctx = lightCanvas.getContext('2d');

function conePath(x,y,ang,range,fov){
  const rays = 42;
  ctx.beginPath(); ctx.moveTo(x,y);
  for(let i=0;i<=rays;i++){
    const a = ang - fov/2 + (fov*i)/rays;
    const d = rayDist(x,y,a,range);
    ctx.lineTo(x+Math.cos(a)*d, y+Math.sin(a)*d);
  }
  ctx.closePath();
}
function drawWorld(){
  const x0=Math.max(0,Math.floor(G.camX/TILE)-1), x1=Math.min(MAPW-1,Math.ceil((G.camX+W)/TILE)+1);
  const y0=Math.max(0,Math.floor(G.camY/TILE)-1), y1=Math.min(MAPH-1,Math.ceil((G.camY+H)/TILE)+1);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const t=tileAt(tx,ty), px=tx*TILE-G.camX, py=ty*TILE-G.camY;
    // floor base
    ctx.fillStyle = t==='S' ? '#0a1020' : t==='L' ? '#241d10' : '#141b2c';
    ctx.fillRect(px,py,TILE,TILE);
    ctx.strokeStyle='rgba(120,160,255,0.05)'; ctx.lineWidth=1;
    ctx.strokeRect(px+0.5,py+0.5,TILE-1,TILE-1);
    if(t==='S'){ ctx.fillStyle='rgba(20,40,90,0.35)'; ctx.fillRect(px,py,TILE,TILE); }
    if(t==='L'){
      const gr=ctx.createRadialGradient(px+TILE/2,py+TILE/2,4,px+TILE/2,py+TILE/2,TILE*0.9);
      gr.addColorStop(0,'rgba(255,196,90,0.30)'); gr.addColorStop(1,'rgba(255,196,90,0)');
      ctx.fillStyle=gr; ctx.fillRect(px-TILE/2,py-TILE/2,TILE*2,TILE*2);
    }
    if(t==='D'){
      ctx.fillStyle='#1d2942'; ctx.fillRect(px+3,py+3,TILE-6,TILE-6);
      ctx.strokeStyle='#3d5a8f'; ctx.strokeRect(px+3.5,py+3.5,TILE-7,TILE-7);
    }
  }
  // extraction pad
  const ex=exitPad.x-G.camX, ey=exitPad.y-G.camY, active = G.cores>=G.coresTotal;
  const pulse = 0.6+0.4*Math.sin(performance.now()/280);
  ctx.save();
  ctx.strokeStyle = active ? 'rgba(60,255,150,'+(0.55+0.4*pulse)+')' : 'rgba(120,130,150,0.5)';
  ctx.lineWidth=3; ctx.strokeRect(ex-17,ey-17,34,34);
  ctx.fillStyle = active ? 'rgba(60,255,150,0.16)' : 'rgba(120,130,150,0.08)';
  ctx.fillRect(ex-17,ey-17,34,34);
  ctx.fillStyle = active ? '#5cffa6' : '#8a94a8';
  ctx.font='bold 10px Arial'; ctx.textAlign='center';
  ctx.fillText(active?'EXTRACTION':'LOCKED', ex, ey+3);
  ctx.restore();
  // pickups (data cores)
  for(const pk of pickups){
    if(pk.got) continue;
    const px=pk.x-G.camX, py=pk.y-G.camY + Math.sin(pk.phase)*3;
    ctx.save(); ctx.translate(px,py); ctx.rotate(pk.phase*0.6);
    ctx.shadowColor='#39e6ff'; ctx.shadowBlur=14;
    ctx.fillStyle='#39e6ff';
    ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(7,0); ctx.lineTo(0,10); ctx.lineTo(-7,0); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#dff9ff';
    ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(3.5,0); ctx.lineTo(0,5); ctx.lineTo(-3.5,0); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.strokeStyle='rgba(57,230,255,'+(0.25+0.2*Math.sin(pk.phase*2))+')'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(px,py,15+2*Math.sin(pk.phase*2),0,TAU); ctx.stroke();
  }
  // walls + crates (drawn after floor so they read as solid cover)
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const t=tileAt(tx,ty); if(t!=='#' && t!=='C') continue;
    const px=tx*TILE-G.camX, py=ty*TILE-G.camY;
    if(t==='#'){
      ctx.fillStyle='#2c3a58'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#3d5078'; ctx.fillRect(px,py,TILE,7);
      ctx.fillStyle='#1b2742'; ctx.fillRect(px,py+TILE-5,TILE,5);
      ctx.strokeStyle='rgba(140,175,255,0.16)'; ctx.strokeRect(px+0.5,py+0.5,TILE-1,TILE-1);
    } else {
      ctx.fillStyle='#7c4f22'; ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
      ctx.fillStyle='#96642e'; ctx.fillRect(px+2,py+2,TILE-4,8);
      ctx.strokeStyle='#4c2f12'; ctx.lineWidth=2; ctx.strokeRect(px+3,py+3,TILE-6,TILE-6);
      ctx.beginPath(); ctx.moveTo(px+3,py+3); ctx.lineTo(px+TILE-3,py+TILE-3);
      ctx.moveTo(px+TILE-3,py+3); ctx.lineTo(px+3,py+TILE-3); ctx.stroke();
    }
  }
}
function drawCones(){
  for(const c of cameras){
    const eye=camEye(c);
    conePath(eye.x-G.camX, eye.y-G.camY, c.angle, CAM_RANGE, CAM_FOV);
    ctx.fillStyle = c.meter>0.6 ? 'rgba(255,70,60,0.20)' : 'rgba(255,120,80,0.13)';
    ctx.fill();
  }
  for(const g of guards){
    conePath(g.x-G.camX, g.y-G.camY, g.angle, GUARD_RANGE, GUARD_FOV);
    ctx.fillStyle = g.state==='alert' ? 'rgba(255,55,45,0.30)'
      : g.state==='suspicious' ? 'rgba(255,150,50,0.24)'
      : 'rgba(255,214,90,0.16)';
    ctx.fill();
    ctx.strokeStyle='rgba(255,220,120,0.10)'; ctx.lineWidth=1; ctx.stroke();
  }
}
function drawLighting(){
  lctx.clearRect(0,0,W,H);
  lctx.globalCompositeOperation='source-over';
  lctx.fillStyle='rgba(3,5,16,0.52)'; lctx.fillRect(0,0,W,H);
  lctx.globalCompositeOperation='destination-out';
  const hole=(x,y,r,a)=>{
    const gr=lctx.createRadialGradient(x,y,4,x,y,r);
    gr.addColorStop(0,'rgba(0,0,0,'+a+')'); gr.addColorStop(1,'rgba(0,0,0,0)');
    lctx.fillStyle=gr; lctx.beginPath(); lctx.arc(x,y,r,0,TAU); lctx.fill();
  };
  hole(P.x-G.camX, P.y-G.camY, 190, 0.85);
  for(const g of guards) hole(g.x-G.camX, g.y-G.camY, 120, 0.55);
  for(const c of cameras){ const e=camEye(c); hole(e.x-G.camX, e.y-G.camY, 90, 0.5); }
  const x0=Math.max(0,Math.floor(G.camX/TILE)-1), x1=Math.min(MAPW-1,Math.ceil((G.camX+W)/TILE)+1);
  const y0=Math.max(0,Math.floor(G.camY/TILE)-1), y1=Math.min(MAPH-1,Math.ceil((G.camY+H)/TILE)+1);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++)
    if(tileAt(tx,ty)==='L') hole(tx*TILE+TILE/2-G.camX, ty*TILE+TILE/2-G.camY, 95, 0.8);
  ctx.drawImage(lightCanvas,0,0);
}
function drawActor(x,y,angle,body,trim,r,sneak){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0,r*0.75,r*0.95,r*0.4,0,0,TAU); ctx.fill();
  ctx.rotate(angle);
  ctx.fillStyle=body;
  ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
  ctx.fillStyle=trim;
  ctx.beginPath(); ctx.arc(r*0.28,0,r*0.55,-1.1,1.1); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0c1220';
  ctx.beginPath(); ctx.arc(r*0.62,0,r*0.3,0,TAU); ctx.fill();
  ctx.restore();
  if(sneak){ ctx.strokeStyle='rgba(57,230,255,0.5)'; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(x,y,r+4,0,TAU); ctx.stroke(); ctx.setLineDash([]); }
}
function drawEntities(){
  for(const c of cameras){
    const px=c.x-G.camX, py=c.y-G.camY, eye=camEye(c);
    ctx.fillStyle='#202a40'; ctx.fillRect(px-9,py-9,18,18);
    ctx.strokeStyle='#5b7bb4'; ctx.strokeRect(px-9.5,py-9.5,19,19);
    ctx.fillStyle = c.meter>0.05 ? '#ff5040' : '#ffb020';
    ctx.beginPath(); ctx.arc(eye.x-G.camX, eye.y-G.camY, 4.5, 0, TAU); ctx.fill();
    if(c.meter>0.05){
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(px-14,py-20,28,5);
      ctx.fillStyle='#ff5040'; ctx.fillRect(px-14,py-20,28*c.meter,5);
    }
  }
  for(const g of guards){
    drawActor(g.x-G.camX, g.y-G.camY, g.angle, '#c2432f', '#7e2417', g.r, false);
    // cap brim
    ctx.save(); ctx.translate(g.x-G.camX,g.y-G.camY); ctx.rotate(g.angle);
    ctx.fillStyle='#e8b13c'; ctx.fillRect(g.r*0.1,-g.r*0.55,g.r*0.75,g.r*1.1); ctx.restore();
    if(g.state==='suspicious' || g.state==='alert'){
      const pop = g.popT>0 ? 1+g.popT*0.7 : 1;
      ctx.save(); ctx.translate(g.x-G.camX, g.y-G.camY-24); ctx.scale(pop,pop);
      ctx.font='bold 17px Arial'; ctx.textAlign='center';
      ctx.fillStyle = g.state==='alert' ? '#ff4040' : '#ffc832';
      ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=3;
      const s = g.state==='alert' ? '!' : '?';
      ctx.strokeText(s,0,0); ctx.fillText(s,0,0); ctx.restore();
    }
    if(g.meter>0.03 && g.state!=='alert'){
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(g.x-G.camX-13,g.y-G.camY-19,26,4);
      ctx.fillStyle='#ffc832'; ctx.fillRect(g.x-G.camX-13,g.y-G.camY-19,26*g.meter,4);
    }
  }
  drawActor(P.x-G.camX, P.y-G.camY, P.angle, '#1f7f8c', '#39e6ff', P.r, P.sneak);
  for(const p of particles){
    ctx.globalAlpha = 1 - p.t/p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x-G.camX, p.y-G.camY, p.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.font='bold 12px Arial'; ctx.textAlign='center';
  for(const f of floats){
    ctx.globalAlpha = 1 - f.t/1.1; ctx.fillStyle=f.color;
    ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=3;
    ctx.strokeText(f.text, f.x-G.camX, f.y-G.camY); ctx.fillText(f.text, f.x-G.camX, f.y-G.camY);
  }
  ctx.globalAlpha=1;
}

    ['Shadow tiles (dark)','Detection fills much slower'],
    ['Light pools (amber)','You are exposed — cross fast or avoid'],
    ['Crates & walls','Block vision cones — use them as cover'],
    ['P pause · R restart · M mute','']
  ];
  lines.forEach((l,i)=>{ ctx.fillStyle='#39e6ff'; ctx.fillText(l[0], W/2-228, 314+i*17);
    ctx.fillStyle='#9fc2ff'; ctx.fillText(l[1], W/2-28, 314+i*17); });
  const blink = Math.sin(performance.now()/350)>-0.2;
  if(blink){ ctx.textAlign='center'; ctx.font='bold 19px Arial'; ctx.fillStyle='#5cffa6';
    ctx.fillText('PRESS ENTER TO BEGIN', W/2, 462); }
  ctx.font='11px Arial'; ctx.fillStyle='#5f76a3'; ctx.textAlign='center';
  ctx.fillText('An original stealth game · 2 missions · ghost bonus for zero alarms', W/2, 566);
}
function drawBrief(){
  drawWorld(); drawLighting(); drawCones(); drawEntities();
  ctx.fillStyle='rgba(4,7,16,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(10,18,38,0.95)'; ctx.fillRect(W/2-300,150,600,300);
  ctx.strokeStyle='#39e6ff'; ctx.lineWidth=2; ctx.strokeRect(W/2-300,150,600,300);
  ctx.textAlign='center';
  ctx.font='900 30px "Arial Black",Arial'; ctx.fillStyle='#eaf7ff';
  ctx.fillText(levelName, W/2, 205);
  ctx.font='14px Arial'; ctx.fillStyle='#9fc2ff';
  ctx.fillText(levelBrief, W/2, 238);
  ctx.textAlign='left'; ctx.font='13px Arial';
  const rows=[
    ['OBJECTIVE','Recover '+G.coresTotal+' data cores, then reach EXTRACTION'],
    ['GUARDS', guards.length+' patrols — cones fill the detection meter'],
    ['CAMERAS', cameras.length+' sweeping cameras — full meter raises the alarm'],
    ['GHOST BONUS','+500 score for finishing with zero alarms'],
    ['CAUGHT','A guard grabbing you ends the mission']
  ];
  rows.forEach((r,i)=>{ ctx.fillStyle='#39e6ff'; ctx.fillText(r[0], W/2-268, 282+i*26);
    ctx.fillStyle='#cfe6ff'; ctx.fillText(r[1], W/2-120, 282+i*26); });
  const blink = Math.sin(performance.now()/350)>-0.2;
  if(blink){ ctx.textAlign='center'; ctx.font='bold 17px Arial'; ctx.fillStyle='#5cffa6';
    ctx.fillText('ENTER — DEPLOY', W/2, 422); }
}
function drawEnd(win){
  drawWorld(); drawLighting(); drawCones(); drawEntities(); drawHUD();
  ctx.fillStyle='rgba(4,7,16,0.74)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  if(win){
    ctx.font='900 44px "Arial Black",Arial'; ctx.fillStyle='#5cffa6';
    ctx.shadowColor='#5cffa6'; ctx.shadowBlur=18;
    ctx.fillText('MISSION COMPLETE', W/2, 210); ctx.shadowBlur=0;
    ctx.font='bold 20px Arial'; ctx.fillStyle='#ffe9a8';
    ctx.fillText('RANK: '+G.rank, W/2, 252);
    ctx.font='15px Arial'; ctx.fillStyle='#cfe6ff';
    ctx.fillText('Time '+fmtTime(G.time)+'   ·   Alarms '+G.alarms+'   ·   Cores '+G.cores+'/'+G.coresTotal, W/2, 288);
    ctx.fillText('Mission score '+G.levelScore+'   ·   Total '+G.score, W/2, 316);
    ctx.font='bold 16px Arial'; ctx.fillStyle='#5cffa6';
    ctx.fillText(G.level+1<LEVELS.length ? 'ENTER — NEXT MISSION' : 'ENTER — FINISH', W/2, 372);
  } else {
    ctx.font='900 44px "Arial Black",Arial'; ctx.fillStyle='#ff5040';
    ctx.shadowColor='#ff5040'; ctx.shadowBlur=18;
    ctx.fillText('COMPROMISED', W/2, 220); ctx.shadowBlur=0;
    ctx.font='15px Arial'; ctx.fillStyle='#cfe6ff';
    ctx.fillText('A guard caught you. The vault keeps its secrets… this time.', W/2, 262);
    ctx.fillText('Cores recovered: '+G.cores+' / '+G.coresTotal+'   ·   Survived '+fmtTime(G.time), W/2, 292);
    ctx.font='bold 16px Arial'; ctx.fillStyle='#5cffa6';
    ctx.fillText('R / ENTER — TRY AGAIN', W/2, 350);
  }
}
function drawVictory(){
  screenBase();
  ctx.textAlign='center';
  ctx.font='900 52px "Arial Black",Arial'; ctx.fillStyle='#5cffa6';
  ctx.shadowColor='#5cffa6'; ctx.shadowBlur=22;
  ctx.fillText('VAULT CLEANED OUT', W/2, 220); ctx.shadowBlur=0;
  ctx.font='16px Arial'; ctx.fillStyle='#cfe6ff';
  ctx.fillText('Both missions complete. The night never saw you coming.', W/2, 262);
  ctx.font='bold 20px Arial'; ctx.fillStyle='#ffe9a8';
  ctx.fillText('TOTAL SCORE  '+G.score, W/2, 312);
  ctx.font='14px Arial'; ctx.fillStyle='#9fc2ff';
  ctx.fillText('Total time '+fmtTime(G.totalTime), W/2, 342);
  ctx.font='bold 16px Arial'; ctx.fillStyle='#5cffa6';
  ctx.fillText('ENTER — BACK TO TITLE', W/2, 410);
}
function render(){
  ctx.save();
  if(G.shake>0){ const s=G.shake*14; ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s); }
  if(G.mode==='title'){ drawTitle(); ctx.restore(); return; }
  if(G.mode==='victory'){ drawVictory(); ctx.restore(); return; }
  if(G.mode==='brief'){ drawBrief(); ctx.restore(); return; }
  if(G.mode==='win'){ drawEnd(true); ctx.restore(); return; }
  if(G.mode==='lose'){ drawEnd(false); ctx.restore(); return; }
  drawWorld(); drawLighting(); drawCones(); drawEntities(); drawHUD();
  if(G.mode==='pause'){
    ctx.fillStyle='rgba(4,7,16,0.66)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.font='900 36px "Arial Black",Arial'; ctx.fillStyle='#eaf7ff';
    ctx.fillText('PAUSED', W/2, H/2-8);
    ctx.font='14px Arial'; ctx.fillStyle='#9fc2ff';
    ctx.fillText('P / ESC — resume    ·    R — restart mission', W/2, H/2+26);
  }
  ctx.restore();
}

// ---------------- 9. MAIN LOOP ----------------
let lastT = 0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, lastT ? (ts-lastT)/1000 : 0.016);
  lastT = ts;
  update(dt);
  render();
}
loadLevel(0);            // prime the world so brief/title previews render
requestAnimationFrame(frame);

// Small debug/test handle (also handy when reusing this engine for variants).
if(typeof window!=='undefined') window.__NV = { LEVELS, G, P, loadLevel, findPath, isSolidTile, onKey,
  getGuards:()=>guards, getCameras:()=>cameras, getPickups:()=>pickups };
</script>
</body>
</html>
